spring.application.name=library

# ---------- Database (H2, file based so data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---------- Web ----------
# Lets HTML forms send PUT and DELETE through a hidden "_method" field
spring.mvc.hiddenmethod.filter.enabled=true
# Keep the session id in a cookie instead of the URL (;jsessionid=...)
server.servlet.session.tracking-modes=cookie

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Lets Tomcat send our error page instead of resetting the connection
server.tomcat.max-swallow-size=-1
app.upload.dir=uploads

# ---------- Pagination defaults for Pageable parameters ----------
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
