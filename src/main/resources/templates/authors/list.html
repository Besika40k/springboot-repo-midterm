<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Authors')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('authors')}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">Authors</h1>
        <a class="btn btn-primary" th:href="@{/authors/new}">+ New author</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/authors}" method="get">
        <div class="col-sm-6 col-md-5">
            <input type="search" class="form-control" name="keyword" th:value="${keyword}"
                   placeholder="Search by pen name or original name">
        </div>
        <div class="col-auto">
            <select class="form-select" name="size" aria-label="Page size">
                <option th:each="s : ${ {5, 10, 20} }" th:value="${s}"
                        th:text="${s} + ' per page'" th:selected="${s == size}">10</option>
            </select>
        </div>
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="dir" th:value="${dir}">
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Search</button>
            <a class="btn btn-link" th:href="@{/authors}">Reset</a>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:each="col : ${ {'penName', 'originalName'} }">
                        <a class="sort-link"
                           th:href="@{/authors(keyword=${keyword}, size=${size}, sort=${col},
                                    dir=${sort == col and dir == 'asc'} ? 'desc' : 'asc')}">
                            <span th:text="${col == 'penName'} ? 'Pen name' : 'Original name'">Name</span>
                            <span th:if="${sort == col}"
                                  th:text="${dir == 'asc'} ? '&#9650;' : '&#9660;'"></span>
                        </a>
                    </th>
                    <th class="text-center">Novels</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${authors.empty}">
                    <td colspan="4" class="text-center text-muted py-4">No authors found.</td>
                </tr>
                <tr th:each="author : ${authors.content}">
                    <td>
                        <a class="fw-semibold" th:href="@{/authors/{id}(id=${author.id})}"
                           th:text="${author.penName}">Name</a>
                    </td>
                    <td th:text="${author.originalName} ?: '-'">original</td>
                    <td class="text-center" th:text="${#lists.size(author.novels)}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/authors/{id}/edit(id=${author.id})}">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2"
         th:if="${authors.totalElements > 0}">
        <span class="text-muted small"
              th:text="|Showing ${authors.number * authors.size + 1}-${authors.number * authors.size + authors.numberOfElements} of ${authors.totalElements} authors|">
            Showing 1-10 of 20
        </span>
        <nav th:if="${authors.totalPages > 1}" aria-label="Author pages">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${authors.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/authors(keyword=${keyword}, page=${authors.number - 1},
                                size=${size}, sort=${sort}, dir=${dir})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, authors.totalPages - 1)}"
                    th:classappend="${i == authors.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/authors(keyword=${keyword}, page=${i},
                                size=${size}, sort=${sort}, dir=${dir})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${authors.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/authors(keyword=${keyword}, page=${authors.number + 1},
                                size=${size}, sort=${sort}, dir=${dir})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
