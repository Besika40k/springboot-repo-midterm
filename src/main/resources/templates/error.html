<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container text-center py-5">
    <h1 class="display-4 fw-bold" th:text="${status} ?: 'Error'">500</h1>
    <p class="lead" th:text="${error} ?: 'Something went wrong.'">Something went wrong.</p>
    <a class="btn btn-primary" th:href="@{/}">Back to the dashboard</a>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
