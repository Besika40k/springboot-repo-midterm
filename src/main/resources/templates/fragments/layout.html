<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Light Novel Library'">Light Novel Library</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Light Novel Library</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'novels'} ? 'active'"
                       th:href="@{/novels}">Novels</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'authors'} ? 'active'"
                       th:href="@{/authors}">Authors</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'genres'} ? 'active'"
                       th:href="@{/genres}">Genres</a>
                </li>
            </ul>
            <a class="btn btn-outline-light btn-sm" th:href="@{/novels/new}">+ Add novel</a>
        </div>
    </div>
</nav>

<div th:fragment="flash">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${successMessage}">Saved</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
                aria-label="Close"></button>
    </div>
</div>

<span th:fragment="statusBadge(status)" class="badge"
      th:classappend="${status.name() == 'ONGOING'} ? 'text-bg-success'
                      : (${status.name() == 'COMPLETED'} ? 'text-bg-primary' : 'text-bg-warning')"
      th:text="${status.label}">Status</span>

<span th:fragment="rating(value)" class="rating"
      th:text="${value != null} ? '★ ' + ${#numbers.formatDecimal(value, 1, 1)} : 'Not rated'">★ 4.5</span>

<th:block th:fragment="footer">
    <footer class="border-top mt-5 py-4 text-center text-muted small">
        Light Novel Library &middot; Spring Boot midterm project
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
